<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2a5b"><title>CubaHoy</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#17202a}header{background:linear-gradient(135deg,#0b2a5b,#123f82);color:white;padding:18px 16px}.brand{font-size:30px;font-weight:900}.brand span{color:#e31d2f}.tag{font-size:13px;opacity:.85}main{max-width:900px;margin:auto;padding:16px}.card{background:white;border-radius:15px;margin-bottom:15px;overflow:hidden;box-shadow:0 2px 10px #0001}.card img{width:100%;max-height:300px;object-fit:cover}.pad{padding:16px}.breaking{color:#e31d2f;font-weight:800;font-size:12px;text-transform:uppercase}h1{font-size:27px;margin:8px 0}.meta{color:#667085;font-size:13px}.content{line-height:1.6;white-space:pre-wrap}.empty{text-align:center;padding:30px;color:#667085}</style></head>
<body><header><div class="brand">Cuba<span>Hoy</span></div><div class="tag">Noticias de Cuba y el mundo</div></header><main id="app"><div class="empty">Cargando noticias…</div></main>
<script>
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function load(){try{let ns=await (await fetch("/api/news")).json();document.getElementById("app").innerHTML=ns.length?ns.map(n=>`<article class="card">${n.image?`<img src="${esc(n.image)}">`:""}<div class="pad">${n.breaking?'<div class="breaking">Última hora</div>':""}<h1>${esc(n.title)}</h1><div class="meta">${esc(n.category)} · ${new Date(n.created_at+"Z").toLocaleString("es-ES")}</div><p class="content">${esc(n.content)}</p></div></article>`).join(""):'<div class="empty">No hay noticias.</div>'}catch(e){document.getElementById("app").innerHTML='<div class="empty">No se pudo conectar.</div>'}}load();
</script></main></body></html>
