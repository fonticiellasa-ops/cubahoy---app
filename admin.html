<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración CubaHoy</title>
<style>body{font-family:Arial;margin:0;background:#eef2f6;color:#17202a}header{background:#0b2a5b;color:#fff;padding:18px;font-weight:900;font-size:23px}main{max-width:850px;margin:auto;padding:16px}.box{background:#fff;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 10px #0001}input,textarea,select{width:100%;padding:11px;margin:7px 0 12px;border:1px solid #ccd3dc;border-radius:8px}textarea{min-height:140px}button{background:#e31d2f;color:#fff;border:0;padding:11px 15px;border-radius:8px;font-weight:700}.item{border-top:1px solid #ddd;padding:13px 0}.small{color:#667085;font-size:13px}.hide{display:none}</style></head>
<body><header>CubaHoy — Panel de administración</header><main>
<div id="login" class="box"><h2>Acceso</h2><input id="user" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button><p class="small">Demo: admin / cubahoy-demo</p></div>
<div id="panel" class="hide"><div class="box"><h2>Publicar noticia</h2><input id="title" placeholder="Título"><select id="category"><option>Cuba</option><option>Internacional</option><option>Economía</option><option>Sociedad</option><option>Deportes</option></select><input id="image" placeholder="URL de imagen"><textarea id="content" placeholder="Contenido"></textarea><label><input id="breaking" type="checkbox"> Última hora</label><br><br><button onclick="publish()">Publicar</button></div><div class="box"><h2>Noticias</h2><div id="list"></div></div></div></main>
<script>
let token="";const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:user.value,password:pass.value})});let x=await r.json();if(r.ok){token=x.token;document.getElementById("login").classList.add("hide");document.getElementById("panel").classList.remove("hide");load()}else alert(x.error)}
async function load(){let ns=await(await fetch("/api/news")).json();list.innerHTML=ns.map(n=>`<div class="item"><b>${esc(n.title)}</b><div class="small">${esc(n.category)}</div><p>${esc(n.content).slice(0,180)}</p><button onclick="del(${n.id})">Eliminar</button></div>`).join("")}
async function publish(){let body={title:title.value,content:content.value,category:category.value,image:image.value,breaking:breaking.checked};let r=await fetch("/api/news",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(body)});if(r.ok){title.value="";content.value="";image.value="";breaking.checked=false;load();alert("Noticia publicada")}else alert((await r.json()).error)}
async function del(id){if(confirm("¿Eliminar esta noticia?")){await fetch("/api/news/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});load()}}
</script></body></html>
