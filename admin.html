<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administración - CubaHoy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f4f8;
      color: #222;
    }

    header {
      background: #075bbb;
      color: white;
      padding: 18px;
    }

    .header-content {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    .logo span {
      color: #ffd400;
    }

    .back {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,.15);
      padding: 9px 12px;
      border-radius: 8px;
    }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px 40px;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .button {
      border: none;
      border-radius: 8px;
      padding: 13px 18px;
      margin-top: 20px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .publish {
      background: #075bbb;
      color: white;
      width: 100%;
    }

    .clear {
      background: #ddd;
      color: #222;
      width: 100%;
    }

    .preview {
      margin-top: 30px;
      border-top: 1px solid #ddd;
      padding-top: 20px;
    }

    .news-item {
      background: #f7f8fa;
      padding: 15px;
      margin-top: 12px;
      border-radius: 10px;
    }

    .news-item h3 {
      margin-bottom: 7px;
    }

    .category {
      color: #075bbb;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .delete {
      background: #c62828;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 10px;
      cursor: pointer;
    }

    .notice {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #d8f3dc;
      color: #155724;
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">

    <div class="logo">
      Cuba<span>Hoy</span>
    </div>

    <a class="back" href="index.html">
      ← Ver CubaHoy
    </a>

  </div>
</header>

<main>

  <div class="panel">

    <h1>Panel de administración</h1>

    <p class="subtitle">
      Publica y administra las noticias de CubaHoy.
    </p>

    <label for="title">
      Título de la noticia
    </label>

    <input
      id="title"
      type="text"
      placeholder="Escribe el título..."
    >

    <label for="category">
      Categoría
    </label>

    <select id="category">

      <option value="Cuba">
        🇨🇺 Cuba
      </option>

      <option value="Internacional">
        🌎 Internacional
      </option>

      <option value="Deportes">
        ⚽ Deportes
      </option>

      <option value="Videos">
        📹 Videos
      </option>

      <option value="Fotos">
        📸 Fotos
      </option>

    </select>

    <label for="image">
      URL de la imagen
    </label>

    <input
      id="image"
      type="text"
      placeholder="https://..."
    >

    <label for="content">
      Contenido de la noticia
    </label>

    <textarea
      id="content"
      placeholder="Escribe aquí la noticia..."
    ></textarea>

    <button
      class="button publish"
      onclick="publishNews()"
    >
      📰 Publicar noticia
    </button>

    <button
      class="button clear"
      onclick="clearForm()"
    >
      Limpiar formulario
    </button>

    <div
      id="notice"
      class="notice success"
    >
      ¡Noticia guardada correctamente!
    </div>

    <div class="preview">

      <h2>
        Noticias guardadas
      </h2>

      <div id="newsList"></div>

    </div>

  </div>

</main>

<script>

  let news = JSON.parse(
    localStorage.getItem("cubahoy_news") || "[]"
  );

  function publishNews() {

    const title =
      document.getElementById("title").value.trim();

    const category =
      document.getElementById("category").value;

    const image =
      document.getElementById("image").value.trim();

    const content =
      document.getElementById("content").value.trim();

    if (!title || !content) {

      alert(
        "Debes escribir un título y el contenido de la noticia."
      );

      return;
    }

    const newNews = {

      id: Date.now(),

      title: title,

      category: category,

      image: image,

      content: content,

      date: new Date().toLocaleString("es-CU")

    };

    news.unshift(newNews);

    localStorage.setItem(
      "cubahoy_news",
      JSON.stringify(news)
    );

    document.getElementById("notice").style.display =
      "block";

    clearForm();

    showNews();

  }

  function clearForm() {

    document.getElementById("title").value = "";

    document.getElementById("image").value = "";

    document.getElementById("content").value = "";

  }

  function showNews() {

    const list =
      document.getElementById("newsList");

    list.innerHTML = "";

    if (news.length === 0) {

      list.innerHTML =
        "<p>No hay noticias publicadas todavía.</p>";

      return;
    }

    news.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "news-item";

      div.innerHTML = `

        <div class="category">
          ${item.category}
        </div>

        <h3>
          ${item.title}
        </h3>

        <p>
          ${item.content}
        </p>

        <small>
          ${item.date}
        </small>

        <br>

        <button
          class="delete"
          onclick="deleteNews(${item.id})"
        >
          🗑️ Eliminar
        </button>

      `;

      list.appendChild(div);

    });

  }

  function deleteNews(id) {

    if (!confirm("¿Eliminar esta noticia?")) {
      return;
    }

    news =
      news.filter(item => item.id !== id);

    localStorage.setItem(
      "cubahoy_news",
      JSON.stringify(news)
    );

    showNews();

  }

  showNews();

</script>

</body>
</html>
